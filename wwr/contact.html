<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rufiji Rapids Rafting</title>
    <meta name="description"
      content="Get in touch with Rufiji Rapids Rafting for reservations, questions, or feedback. Find our address, phone, email, and location map.">
    <meta name="author" content="Baraka Shadrack Were">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rufiji Rapids Rafting logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>Rufiji Rapids Rafting</h1>
            <p>123 Main River Street</p>
            <p>Rufiji, Pwani, Tanzania</p>
            <p>+255 7470 72438</p>
            <p>info@rufijirapids.com</p>
        </section>

        <section class="contact-content">
            <iframe
                src="https://www.google.com/maps?q=123+Main+River+Street,+Rufiji,+Pwani,+Tanzania&output=embed"
                width="400" height="300" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                title="Map showing Rufiji Rapids Rafting location"></iframe>

            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Placeholder" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Placeholder" required>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>

                <label class="checkbox-label">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of head river guide">
                    <figcaption>Kambanyuma Mkapa &ndash; Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of reservations manager">
                    <figcaption>Baraka Were &ndash; Reservations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of safety coordinator">
                    <figcaption>Jofrey Osewe &ndash; Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rufiji Rapids Rafting &ndash; Baraka Shadrack Were</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
